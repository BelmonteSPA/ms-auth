server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: ms-auth

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_auth?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

jwt:
  # clave para firmar los tokens (minimo 32 caracteres). En un entorno real se define con la variable JWT_SECRET
  secret: ${JWT_SECRET:belmonte-dev-secret-cambiar-en-produccion-0123456789abcdef}
  expiration-minutes: 480

# URL de ms-pasajeros (con Eureka activo se deja vacia y se resuelve por nombre)
clients:
  pasajeros:
    url: ${MS_PASAJEROS_URL:http://localhost:8082}

eureka:
  client:
    enabled: false
